<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E9E6B">
<title>만만패턴 샘플</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<style>
/* Layout: one-screen phone app. Green world for home and tabs (character on a paper card, floating tab pill),
   pale paper for question screens (no character), feedback rises as a bottom sheet. Single committed look. */
:root {
  --green: #2E9E6B;      /* world background */
  --green-2: #258A5C;    /* pills on green */
  --paper: #F5F8F3;      /* question screens, cards */
  --ink: #10382A;        /* text, primary dark keys */
  --ink-lip: #061F16;
  --ink-soft: #4E6B5D;
  --mute: #9DB8AA;
  --line: #DDE7E0;
  --yellow: #FFD95A;  --yellow-lip: #C9A52E;
  --cream: #FFF6E5;   --cream-lip: #D9C7A4;
  --tomato: #FF6B3D;  --tomato-lip: #C44A2A;
  --blue: #4A5BFF;    --blue-2: #7E8BFF;
  --bad-bg: #FFE9E1;  --bad-ink: #8A2A12;  --bad-line: #F3B9A5;
  --font-en: "Archivo Black", "Arial Black", system-ui, sans-serif;
  --font: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--green); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; overflow: hidden; }
body.paper { background: var(--paper); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { height: 100%; max-width: 480px; margin: 0 auto; position: relative; display: flex; flex-direction: column; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 0; }

/* keycap buttons */
.key { display: block; width: 100%; min-height: 54px; border-radius: 16px; font-weight: 600; font-size: 17px; position: relative;
  box-shadow: 0 5px 0 var(--lip); transform: translateY(0); transition: transform .08s, box-shadow .08s; margin-bottom: 5px; }
.key:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--lip); }
.key.y { background: var(--yellow); color: var(--ink); --lip: var(--yellow-lip); }
.key.d { background: var(--ink); color: var(--paper); --lip: var(--ink-lip); }
.key.c { background: var(--cream); color: var(--ink); --lip: var(--cream-lip); }
.key.w { background: #fff; color: var(--ink); --lip: var(--line); }
.link { display: block; margin: 12px auto 0; padding: 10px 16px; font-size: 15px; font-weight: 500; color: var(--ink-soft); }

/* home */
.home { padding-bottom: 0; }
.pill { align-self: center; background: var(--green-2); color: var(--paper); font-size: 13px; font-weight: 600; padding: 4px 14px; border-radius: 99px; }
.gear { position: absolute; top: 10px; right: max(12px, env(safe-area-inset-right, 0px)); width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--paper); }
.home-stage { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; min-height: 0; }
.home-char { width: 46%; max-width: 190px; margin: 18px auto -26px; position: relative; z-index: 1; }
.home-char svg, .tab-char svg, .done-chars svg { display: block; width: 100%; height: auto; }
.card { background: var(--paper); border-radius: 28px 28px 0 0; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 48px 24px calc(96px + env(safe-area-inset-bottom, 0px)); text-align: center; }
.pattern { font-family: var(--font-en); font-size: clamp(28px, 8.4vw, 36px); line-height: 1.15; letter-spacing: -.01em; }
.slot { display: inline-block; background: var(--yellow); border-radius: 8px; padding: 0 .22em; margin-left: .08em; }
.meaning { color: var(--ink-soft); margin: 8px 0 26px; }

/* tab bar */
.tabbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  width: min(320px, calc(100% - 32px)); background: var(--ink); border-radius: 99px; display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px; }
.tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 0 4px; border-radius: 99px; color: var(--mute); font-size: 11.5px; font-weight: 500; position: relative; }
.tabbar button[aria-current="page"] { color: var(--yellow); }
.tabbar svg { width: 24px; height: 24px; margin-bottom: 2px; }
.badge { position: absolute; top: 2px; left: calc(50% + 8px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--tomato); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }

/* tab pages */
.tab-head { display: flex; align-items: flex-end; justify-content: space-between; margin: 10px 0 14px; }
.tab-head h1 { font-size: 24px; font-weight: 700; color: var(--paper); margin: 0 0 6px; }
.tab-head p { margin: 0; color: #CDE7D9; font-size: 14px; }
.tab-char { width: 96px; flex: none; }
.list { display: grid; gap: 10px; padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
.row { background: var(--paper); border-radius: 18px; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; text-align: left; width: 100%; }
.row .no { width: 34px; height: 34px; border-radius: 11px; background: var(--yellow); display: grid; place-items: center; font-weight: 700; font-size: 14px; grid-row: span 2; }
.row.locked { background: rgba(245, 248, 243, .14); color: #CDE7D9; }
.row.locked .no { background: rgba(245, 248, 243, .18); color: #CDE7D9; }
.row b { font-family: var(--font-en); font-weight: 400; font-size: 16px; }
.row .sub { font-size: 13px; color: var(--ink-soft); }
.row.locked .sub { color: #A9D2BC; }
.row .acts { grid-column: 2; display: flex; flex-wrap: wrap; margin-top: 6px; }
.row .acts button { font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 10px; background: #fff; margin: 0 6px 6px 0; box-shadow: 0 2px 0 var(--line); }
.row .state { font-size: 12px; font-weight: 600; color: var(--green); }
.note { color: #CDE7D9; font-size: 13px; text-align: center; padding: 8px 0 0; }
.empty { background: var(--paper); border-radius: 22px; padding: 26px 20px; text-align: center; }
.empty .tab-char { margin: 0 auto 10px; }
.streak { display: inline-flex; margin-left: 2px; }
.streak i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); margin-right: 4px; display: inline-block; }
.streak i.on { background: var(--green); }

/* session */
.s-top { display: flex; align-items: center; margin-bottom: 18px; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--ink-soft); flex: none; margin-left: -8px; }
.segs { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.segs i { height: 7px; border-radius: 4px; background: var(--line); }
.segs i.on { background: var(--green); }
.kind { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-bottom: 8px; }
.chip { display: inline-block; border: 1.5px solid var(--green); color: var(--green); border-radius: 99px; padding: 3px 12px; font-size: 13px; font-weight: 600; margin-bottom: 14px; }
.q-ko { font-size: 22px; font-weight: 600; line-height: 1.45; margin: 0 0 18px; }
.ctx { background: #fff; border-radius: 14px; padding: 12px 14px; margin: 0 0 16px; font-size: 15px; }
.ctx .en { font-weight: 600; }
.ctx .sm { font-size: 13px; color: var(--ink-soft); }
.ctx .who { font-weight: 700; color: var(--green); margin-right: 6px; }
.blank-line { font-size: 20px; font-weight: 600; margin: 0 0 18px; }
.blank-line .bl { display: inline-block; min-width: 3.4em; border-bottom: 3px solid var(--green); margin: 0 .15em; color: var(--green); text-align: center; }
.copy { background: #fff; border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
.copy .lab { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
.copy .en { font-size: 18px; font-weight: 600; }
.answer-in { width: 100%; border: 0; border-bottom: 3px solid var(--green); background: transparent; font: inherit; font-size: 20px; font-weight: 500; color: var(--ink); padding: 8px 2px; border-radius: 0; outline: none; }
.answer-in:focus, .answer-in:focus-visible { outline: none; border-bottom-color: var(--ink); }
.answer-in::placeholder { color: var(--mute); font-weight: 400; }
.err { color: var(--bad-ink); font-size: 14px; min-height: 22px; margin: 6px 0 12px; }
.s-actions { margin-top: 4px; padding-bottom: 24px; }

/* intro */
.blocks { display: flex; flex-wrap: wrap; align-items: stretch; margin: 6px 0 18px; }
.blk { background: #fff; border-radius: 14px; padding: 10px 14px; text-align: center; margin: 0 8px 8px 0; box-shadow: 0 3px 0 var(--line); }
.blk.y { background: var(--yellow); box-shadow: 0 3px 0 var(--yellow-lip); }
.blk b { display: block; font-family: var(--font-en); font-weight: 400; font-size: 20px; }
.blk span { font-size: 12px; color: var(--ink-soft); }
.plus { align-self: center; margin: 0 8px 8px 0; color: var(--ink-soft); font-weight: 700; }
.expl { margin: 0 0 18px; padding: 0; list-style: none; }
.expl li { padding: 8px 0; border-top: 1px solid var(--line); font-size: 15.5px; }
.ex { display: flex; align-items: center; background: #fff; border-radius: 14px; padding: 12px 12px 12px 14px; margin-bottom: 10px; }
.ex div { flex: 1; min-width: 0; }
.ex .en { font-weight: 600; font-size: 17px; }
.ex .ko { font-size: 13.5px; color: var(--ink-soft); }
.spk { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; color: var(--green); }

/* sheet */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; border-radius: 26px 26px 0 0;
  padding: 20px max(20px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  transform: translateY(110%); transition: transform .26s cubic-bezier(.2,.8,.2,1); max-height: 82%; overflow-y: auto; }
.sheet.open { transform: none; }
.sheet.ok { background: var(--green); color: var(--paper); }
.sheet.bad { background: var(--bad-bg); color: var(--bad-ink); }
.sheet.neutral { background: var(--paper); color: var(--ink); box-shadow: 0 -8px 30px rgba(16,56,42,.18); }
.sh-title { display: flex; align-items: center; font-size: 18px; font-weight: 700; margin-bottom: 10px; }
.sh-title svg { margin-right: 8px; flex: none; }
.sh-ans { font-size: 19px; font-weight: 600; line-height: 1.4; margin-bottom: 6px; }
.sheet.ok .core { color: var(--yellow); }
.sheet.bad .core { background: #fff; border-radius: 5px; padding: 0 3px; }
.sh-ko { font-size: 14px; opacity: .85; margin-bottom: 12px; }
.sh-note { font-size: 14.5px; margin: 4px 0 12px; }
.sheet.ok .sh-note { color: #E3F4EA; }
.fix { font-weight: 600; }
.sheet.ok .fix s { opacity: .7; }
.mine { font-size: 17px; font-weight: 500; margin-bottom: 8px; }
.mine mark { background: transparent; color: var(--bad-ink); text-decoration: underline wavy #E0552E; text-underline-offset: 4px; font-weight: 700; }
.listen { display: flex; margin: 4px 0 16px; }
.listen button { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 42px; border-radius: 14px; font-size: 14px; font-weight: 600; margin-right: 8px; }
.listen button:last-child { margin-right: 0; }
.listen button svg { margin-right: 6px; }
.sheet.ok .listen button { background: var(--green-2); color: var(--paper); }
.sheet.bad .listen button { background: #fff; color: var(--bad-ink); }
.sheet.neutral .listen button { background: #fff; color: var(--ink); }

/* modal */
.modal { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 20; background: rgba(6, 31, 22, .5); display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal-box { background: var(--paper); border-radius: 24px; padding: 24px 20px 16px; width: 100%; max-width: 340px; text-align: center; }
.modal-box h2 { font-size: 19px; margin: 0 0 6px; }
.modal-box p { margin: 0 0 18px; color: var(--ink-soft); font-size: 15px; }

/* done */
.done { text-align: center; padding-bottom: 30px; }
.done-chars { display: flex; align-items: flex-end; justify-content: center; margin: 14px 0 10px; }
.done-chars div { margin: 0 3px; }
.done h1 { font-size: 26px; color: var(--paper); margin: 0; }
.done .score { color: #CDE7D9; margin: 4px 0 18px; }
.panel { background: var(--paper); border-radius: 22px; padding: 18px 16px; text-align: left; margin-bottom: 12px; }
.panel h2 { font-size: 15px; margin: 0 0 10px; color: var(--ink-soft); }
.tip { padding: 10px 0; border-top: 1px solid var(--line); }
.tip:first-of-type { border-top: 0; padding-top: 0; }
.tip .from { font-size: 14px; color: var(--ink-soft); }
.tip .to { display: flex; align-items: center; font-size: 18px; font-weight: 700; }
.tip .to span { flex: 1; }
.tip .why { font-size: 14px; color: var(--ink-soft); }
.sent { display: flex; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.sent:first-of-type { border-top: 0; }
.sent div { flex: 1; min-width: 0; }
.sent .en { font-weight: 600; }
.sent .ko { font-size: 13px; color: var(--ink-soft); }

/* follow-along */
.follow { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 15; background: var(--paper); display: flex; flex-direction: column; text-align: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
.follow .count { color: var(--ink-soft); font-weight: 600; font-size: 14px; }
.follow .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.follow .en { font-size: 26px; font-weight: 700; line-height: 1.35; }
.follow .ko { color: var(--ink-soft); margin-top: 8px; }
.follow .phase { margin-top: 22px; font-weight: 600; color: var(--green); min-height: 24px; }

.toast { position: absolute; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); z-index: 30; background: var(--ink); color: var(--paper);
  font-size: 14px; font-weight: 500; padding: 10px 16px; border-radius: 99px; opacity: 0; pointer-events: none; transition: .2s; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.settings label { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; }
.settings label:first-of-type { border-top: 0; }
.settings input { width: 22px; height: 22px; accent-color: var(--green); }
@media (prefers-reduced-motion: reduce) { .sheet, .key, .toast { transition: none; } }
</style>
</head>
<body>

<div class="app" id="app">
  <main class="screen" id="screen"></main>
  <nav class="tabbar" id="tabbar" aria-label="메뉴"></nav>
  <section class="sheet" id="sheet" aria-live="polite"></section>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
(function () {
  "use strict";

  /* ================= 콘텐츠 (샘플: 패턴 1) ================= */
  var S = {
    no: 1, form: "I have ~.", stem: "I have", meaning: "나는 ~이 있어요 / ~을 가지고 있어요",
    hint: "I have + 명사",
    intro: {
      blocks: [["I", "나는"], ["have", "가지고 있다"], ["~", "무엇"]],
      lines: [
        "have는 ‘가지고 있다’라는 뜻이에요.",
        "물건뿐 아니라 가족, 시간, 감기처럼 ‘있다’고 말하는 것에 두루 써요.",
        "주어가 I일 때는 have 그대로 써요. (he, she는 has)"
      ],
      examples: [
        { en: "I have a bike.", ko: "나는 자전거가 있어." },
        { en: "I have a meeting today.", ko: "나 오늘 회의 있어." }
      ]
    },
    items: [
      { id: "b1", type: "blank", kind: "빈칸 입력", ko: "나는 강아지가 있어.", before: "I", after: "a dog.", answers: ["have"],
        wrong: { "has": "has는 he, she처럼 다른 한 사람이 주어일 때 써요. I 뒤에는 have예요.", "having": "‘가지고 있다’를 말할 때는 have 그대로 써요.", "am": "‘나는 ~이 있다’는 am이 아니라 have로 말해요." } },
      { id: "b2", type: "blank", kind: "빈칸 입력", ko: "나는 우산이 있어.", before: "I have", after: "umbrella.", answers: ["an"],
        wrong: { "a": "umbrella처럼 모음 소리(엄)로 시작하는 단어 앞에는 an을 써요.", "the": "처음 말하는 물건 하나에는 the가 아니라 a / an을 써요." } },
      { id: "b3", type: "blank", kind: "빈칸 입력", ko: "나는 형제가 두 명 있어.", before: "I", after: "two brothers.", answers: ["have"],
        wrong: { "has": "has는 he, she처럼 다른 한 사람이 주어일 때 써요. I 뒤에는 have예요.", "am": "‘나는 ~이 있다’는 am이 아니라 have로 말해요." } },
      { id: "b4", type: "blank", kind: "빈칸 입력", ko: "나 감기 걸렸어.", before: "I have a", after: ".", answers: ["cold"],
        wrong: { "flu": "flu는 독감이에요. 보통 감기는 cold예요." } },
      { id: "b5", type: "blank", kind: "빈칸 입력", ko: "나 숙제가 많아.", before: "I have a lot of", after: ".", answers: ["homework"],
        wrong: { "homeworks": "homework는 셀 수 없는 말이라 s를 붙이지 않아요." } },
      { id: "s1", type: "sentence", kind: "문장 입력", ko: "나는 차가 있어.", answers: ["I have a car."],
        wrong: { "i have a cars": "a는 ‘하나’라는 뜻이라 cars가 아니라 car예요." } },
      { id: "s2", type: "sentence", kind: "문장 입력", ko: "나 질문 하나 있어.", answers: ["I have a question.", "I have one question."],
        other: { "can i ask you something": "이번엔 I have로 말해 보세요." } },
      { id: "s3", type: "sentence", kind: "문장 입력", ko: "나 오늘 시간 있어.", answers: ["I have time today.", "Today I have time.", "I have some time today."],
        wrong: { "i have a time today": "time이 ‘시간 여유’라는 뜻일 때는 a를 붙이지 않아요." },
        other: { "i am free today": "이번엔 have로 말해 보세요." } },
      { id: "s4", type: "sentence", kind: "문장 입력", ko: "나 머리 아파.", answers: ["I have a headache."],
        other: { "my head hurts": "이번엔 have로 말해 보세요." } },
      { id: "s5", type: "sentence", kind: "바꿔 만들기", ko: "나는 계획이 있어.", answers: ["I have a plan."],
        ctx: { lead: "car 대신 ‘계획’을 넣어 보세요.", en: "I have a car." } },
      { id: "s6", type: "sentence", kind: "대화 완성", ko: "응, 하나 있어.", answers: ["Yes, I have one."],
        dialog: { a: "Do you have a pen?", aKo: "펜 있어?" },
        wrong: { "yes i have a one": "one이 이미 ‘하나’라서 a를 붙이지 않아요.", "yes i have it": "‘하나 있어’는 one을 써요. it은 바로 그 물건을 가리킬 때 써요." },
        other: { "yes i do": "이번엔 I have를 넣어 대답해 보세요." } }
    ],
    tips: [
      { from: "I have a question.", to: "Can I ask you something?", why: "‘질문이 있어’를 ‘뭐 좀 물어봐도 돼요?’처럼 부드럽게 바꾼 말이에요." },
      { from: "I have a headache.", to: "My head hurts.", why: "‘머리가 아파’를 그대로 옮긴 말이에요. 둘 다 자주 써요." }
    ]
  };
  var NEXT = [[2, "I have some ~.", "어떤 ~가 있어요"], [3, "I don't have ~.", "나는 ~이 없어요"], [4, "Do you have any ~?", "~ 있어요?"], [5, "I didn't have any ~.", "나는 ~가 없었어요"],

    }
    if (u.length + 1 === a.length) {
      for (i = 0; i < a.length; i++) { t = a.slice(0, i).concat(a.slice(i + 1)); if (t.join(" ") === u.join(" ")) {
        if (a[i] === "a" || a[i] === "an") return "셀 수 있는 것 하나를 말할 때는 앞에 a(모음 소리면 an)가 필요해요.";
        if (a[i] === "have") return "‘있다, 가지고 있다’를 말하려면 have가 꼭 필요해요.";
        return "빠진 단어가 하나 있어요.";
      } }
    }
    return "";
  }
  function grade(input, it, targetOnly) {
    var N = normalize(input), u = N.toks;
    var answers = targetOnly ? [targetOnly] : (it.type === "blank" ? it.answers : it.answers);
    var key = u.join(" ");
    var A = answers.map(function (a) { return normalize(a).toks; });
    var coreToks = normalize(coreOf(it)).toks;
    var i, j;
    for (i = 0; i < A.length; i++) if (A[i].join(" ") === key) return { status: N.notes.length ? "minor" : "correct", notes: N.notes, answer: answers[i] };
    if (!targetOnly) {
      if (it.wrong && it.wrong[key]) return { status: "wrong", reason: it.wrong[key], marks: markUser(u, A) };
      if (it.other && it.other[key]) return { status: "other", reason: it.other[key], marks: markUser(u, A) };
    }
    /* 오타 판정: 단어 수가 같고, 다른 단어가 실제 단어가 아니며 철자가 가까움 */
    for (i = 0; i < A.length; i++) {
      var a = A[i]; if (a.length !== u.length) continue;
      var notes = N.notes.slice(), ok = true;
      for (j = 0; j < a.length; j++) {
        if (u[j] === a[j]) continue;
        var lim = a[j].length <= 4 ? 1 : 2;
        if (!DICT[u[j]] && lev(u[j], a[j]) <= lim) notes.push({ from: u[j], to: a[j], kind: "typo", core: it.type !== "blank" && coreToks.indexOf(a[j]) >= 0 });
        else { ok = false; break; }
      }
      if (ok) return { status: "minor", notes: notes, answer: answers[i] };
    }
    var reason = "";
    for (i = 0; i < A.length && !reason; i++) reason = ruleReason(u, A[i]);
    return { status: "wrong", reason: reason, marks: markUser(u, A) };
  }
  function markUser(u, A) {
    var best = null;
    A.forEach(function (a) { var r = lcsMask(u, a); r.missing = a.length - r.len; if (!best || r.len - r.missing * 0.1 > best.len - best.missing * 0.1) best = r; });
    var html = u.map(function (w, i) { return best.mask[i] ? esc(w) : "<mark>" + esc(w) + "</mark>"; }).join(" ");
    var extra = best.mask.filter(function (x) { return !x; }).length;
    return { html: html, missing: best.missing, extra: extra };
  }

  /* ================= 음성 ================= */
  var voice = null;
  function pickVoice() {
    if (!("speechSynthesis" in window)) return;
    var vs = speechSynthesis.getVoices().filter(function (v) { return /^en[-_]US/i.test(v.lang); });
    voice = vs.filter(function (v) { return /Samantha|Google US|Natural|Aria|Jenny/i.test(v.name); })[0] || vs[0] || null;
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text, slow, onend) {
    if (!("speechSynthesis" in window)) { toast("이 브라우저는 듣기를 지원하지 않아요"); if (onend) onend(); return; }
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = slow ? 0.5 : 0.95; if (voice) u.voice = voice;
      if (onend) { u.onend = onend; u.onerror = onend; }
      speechSynthesis.speak(u);
    } catch (e) { if (onend) onend(); }
  }
  function stopSpeak() { try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (e) {} }

  /* ================= 시트 ================= */
  function openSheet() { requestAnimationFrame(function () { $sheet.classList.add("open"); }); }
  function closeSheet() { $sheet.classList.remove("open"); }
  function listenBtns(text) {
    return '<div class="listen"><button data-say="n">' + ico("speak", 20) + '보통</button><button data-say="s">' + ico("slow", 20) + "느리게</button></div>";
  }
  $sheet.addEventListener("click", function (e) {
    var b = e.target.closest("[data-say]");
    if (b) speak($sheet.getAttribute("data-text"), b.getAttribute("data-say") === "s");
  });

  /* ================= 세션 ================= */
  var R = null; /* run state */
  function startSession(resume, opt) {
    opt = opt || {};
    stopSpeak(); closeSheet(); drawTabbar(false); setPaper(true); $screen.onclick = null;
    var single = opt.single;
    R = { phase: single ? "single" : "intro", queue: single ? [single] : S.items.map(function (x) { return x.id; }), pos: 0,
          retry: [], firstOk: 0, total: S.items.length, attempt: 0, copy: false, redo: !!opt.redo, single: single, made: [] };
    if (resume && st.progress) { R.phase = st.progress.phase; R.pos = st.progress.pos; R.retry = st.progress.retry || []; R.firstOk = st.progress.firstOk || 0; if (R.phase === "retry") R.queue = R.retry.slice(); }
    render();
  }
  function persist() { if (R.single) return; st.progress = { phase: R.phase, pos: R.pos, retry: R.retry, firstOk: R.firstOk }; save(); }
  function segs() {
    var n = R.queue.length, h = "";
    for (var i = 0; i < n; i++) h += "<i" + (i < R.pos ? ' class="on"' : "") + "></i>";
    return h;
  }
  function topBar() { return '<div class="s-top"><button class="icon-btn" id="quitBtn" aria-label="그만하기">' + ico("close", 22) + '</button><div class="segs">' + segs() + "</div></div>"; }

  function render() {
    $screen.className = "screen"; $screen.scrollTop = 0;
    if (R.phase === "intro") return renderIntro();
    if (R.phase === "retryIntro") return renderRetryIntro();
    if (R.pos >= R.queue.length) return finishPhase();
    renderItem();
  }
  function bindQuit() {
    document.getElementById("quitBtn").onclick = function () {
      stopSpeak();
      $sheet.className = "sheet neutral";
      $sheet.innerHTML = '<div class="sh-title">그만할까요?</div><p class="sh-note" style="color:var(--ink-soft)">' + (R.single ? "이 문제는 나중에 다시 풀 수 있어요." : "다음에 멈춘 문제부터 이어서 할 수 있어요.") + "</p>" +
        '<button class="key y" id="qStay">계속하기</button><button class="link" id="qLeave">나가기</button>';
      openSheet();
      document.getElementById("qStay").onclick = closeSheet;
      document.getElementById("qLeave").onclick = function () { var wasSingle = R.single; if (!wasSingle && R.phase !== "intro") persist(); stopSpeak(); R = null; tab = wasSingle ? "wrong" : "home"; renderTab(); };
    };
  }

  function renderIntro() {
    var I = S.intro, b = "";
    I.blocks.forEach(function (x, i) {
      if (i) b += '<span class="plus">+</span>';
      b += '<div class="blk' + (x[0] === "~" ? " y" : "") + '"><b>' + esc(x[0]) + "</b><span>" + esc(x[1]) + "</span></div>";
    });
    $screen.innerHTML = '<div class="s-top"><button class="icon-btn" id="quitBtn" aria-label="그만하기">' + ico("close", 22) + '</button><div class="kind" style="margin:0">문법 이해</div></div>' +
      '<div class="chip">패턴 1</div><div class="pattern" style="text-align:left;margin-bottom:6px">' + esc(S.form).replace("~", '<span class="slot">~</span>') + "</div>" +
      '<p class="meaning" style="margin:0 0 14px">' + esc(S.meaning) + "</p>" +
      '<div class="blocks">' + b + "</div>" +
      '<ul class="expl">' + I.lines.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ul>" +
      I.examples.map(function (x, i) { return '<div class="ex"><div><div class="en">' + withCore(x.en, S.stem) + '</div><div class="ko">' + esc(x.ko) + '</div></div><button class="spk" data-ex="' + i + '" aria-label="듣기">' + ico("speak", 22) + "</button></div>"; }).join("") +
      '<div class="s-actions" style="margin-top:14px"><button class="key y" id="goBtn">문제 풀기</button></div>';
    $screen.querySelectorAll("[data-ex]").forEach(function (b) { b.onclick = function () { speak(I.examples[+b.getAttribute("data-ex")].en); }; });
    document.getElementById("goBtn").onclick = function () { R.phase = "main"; R.pos = 0; persist(); render(); };
    bindQuit();
  }

  function renderRetryIntro() {
    $screen.innerHTML = '<div style="flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:20px 0">' +
      '<div style="width:120px;margin:0 auto 18px">' + charSVG("keycap", "think", "키캡") + "</div>" +
      '<div class="q-ko" style="margin-bottom:6px">틀린 문제 한 번 더</div><p style="color:var(--ink-soft);margin:0 0 26px">방금 틀린 ' + R.retry.length + "문제를 다시 풀어 볼게요.</p>" +
      '<button class="key y" id="goBtn">다시 풀기</button></div>';
    document.getElementById("goBtn").onclick = function () { R.phase = "retry"; R.queue = R.retry.slice(); R.pos = 0; persist(); render(); };
  }

  function renderItem() {
    var it = itemById(R.queue[R.pos]);
    var label = R.phase === "retry" ? "틀린 문제 한 번 더" : R.phase === "single" ? "틀린 문제" : it.kind + " " + (R.pos + 1) + " / " + R.queue.length;
    var body = "";
    if (it.ctx) body += '<div class="ctx"><div class="sm">' + esc(it.ctx.lead) + '</div><div class="en">' + esc(it.ctx.en) + "</div></div>";
    if (it.dialog) body += '<div class="ctx"><div><span class="who">A</span><span class="en">' + esc(it.dialog.a) + '</span></div><div class="sm" style="margin-left:22px">' + esc(it.dialog.aKo) + '</div><div style="margin-top:6px"><span class="who">B</span><span class="sm">아래 문장을 영어로</span></div></div>';
    body += '<p class="q-ko">' + esc(it.ko) + "</p>";
    if (it.type === "blank") body += '<p class="blank-line">' + esc(it.before) + ' <span class="bl">?</span>' + (it.after === "." ? "." : " " + esc(it.after)) + "</p>";
    if (R.copy) body += '<div class="copy"><div class="lab">정답을 그대로 따라 입력해 보세요</div><div class="en">' + esc(it.type === "blank" ? it.answers[0] : it.answers[0]) + "</div></div>";
    $screen.innerHTML = topBar() + '<div class="kind">' + label + '</div><div class="chip">' + esc(S.hint) + "</div>" + body +
      '<form id="ansForm" autocomplete="off"><input class="answer-in" id="ans" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="' +
      (it.type === "blank" ? "빈칸에 들어갈 말" : "영어로 입력") + '" aria-label="답 입력"><p class="err" id="err" aria-live="polite"></p>' +
      '<div class="s-actions"><button class="key d" type="submit">확인</button></div></form>';
    bindQuit();
    var inp = document.getElementById("ans"), err = document.getElementById("err");
    inp.oninput = function () { err.textContent = ""; };
    document.getElementById("ansForm").onsubmit = function (e) { e.preventDefault(); submit(it, inp.value, err); };
    setTimeout(function () { try { inp.focus({ preventScroll: true }); } catch (x) { inp.focus(); } }, 60);
  }

  function submit(it, val, err) {
    if (!val.trim()) { err.textContent = "먼저 답을 입력해 주세요."; return; }
    document.getElementById("ans").blur();
    var target = R.copy ? it.answers[0] : null;
    var g = grade(val, it, target);
    var good = g.status === "correct" || g.status === "minor";
    if (R.copy) {
      if (!good) { err.textContent = "정답과 똑같이 입력해 주세요."; return; }
      R.copy = false; showOk(it, g, "잘했어요"); return;
    }
    if (good) {
      if (R.attempt === 0) onFirstTryCorrect(it);
      showOk(it, g, g.status === "minor" ? "거의 맞았어요" : "정답이에요");
      return;
    }
    R.attempt++;
    if (R.attempt === 1) markWrongOnce(it);
    if (R.attempt === 1) showBad(it, g, val, false); else showBad(it, g, val, true);
  }
  function onFirstTryCorrect(it) {
    if (R.phase === "main") R.firstOk++;
    if (R.phase === "single") {
      var w = st.wrong[it.id]; if (!w) return;
      w.tabDay = today(); w.streak = (w.streak || 0) + 1;
      if (w.streak >= 2) { delete st.wrong[it.id]; R.cleared = true; }
      save();
    }
  }
  function markWrongOnce(it) {
    if (R.phase === "main") {
      if (R.retry.indexOf(it.id) < 0) R.retry.push(it.id);
      st.wrong[it.id] = { streak: 0, tabDay: null }; save();
    } else if (R.phase === "single") {
      var w = st.wrong[it.id]; if (w) { w.streak = 0; w.tabDay = today(); save(); }
    }
  }

  function showOk(it, g, title) {
    var full = it.type === "blank" ? fullAnswer(it) : (g.answer || it.answers[0]);
    $sheet.setAttribute("data-text", full);
    var notes = "";
    if (g.notes && g.notes.length) notes = '<p class="sh-note">' + g.notes.map(function (n) {
      return '<span class="fix"><s>' + esc(n.from) + "</s> → " + esc(n.to) + "</span>" + (n.core ? " (패턴 부분이에요. 다음엔 정확히 써 봐요)" : "");
    }).join("<br>") + "</p>";
    var extra = (R.phase === "single" && R.attempt === 0 && st.wrong[it.id] === undefined && R.cleared) ? '<p class="sh-note">두 번 연속 맞혀서 틀린 문제 목록에서 빠졌어요.</p>'
      : (R.phase === "single" && R.attempt === 0 && st.wrong[it.id]) ? '<p class="sh-note">한 번 더 맞히면 목록에서 빠져요.</p>' : "";
    $sheet.className = "sheet ok";
    $sheet.innerHTML = '<div class="sh-title">' + ico("ok", 26, "#FFD95A") + esc(title) + "</div>" +
      '<div class="sh-ans">' + withCore(full, coreOf(it)) + '</div><div class="sh-ko">' + esc(it.ko) + "</div>" + notes + extra +
      listenBtns() + '<button class="key y" id="nextBtn">다음</button>';
    openSheet();
    if (st.autoplay) setTimeout(function () { speak(full); }, 250);
    R.made.push({ en: full, ko: it.ko });
    document.getElementById("nextBtn").onclick = next;
  }

  function showBad(it, g, val, reveal) {
    var full = it.type === "blank" ? fullAnswer(it) : it.answers[0];
    $sheet.setAttribute("data-text", full);
    var reason = g.reason || (g.marks && g.marks.missing > 0 && g.marks.extra === 0 ? "빠진 단어가 있어요." : "") || "이 오답은 아직 설명이 없어요. 궁금하면 문장을 검색해 보세요.";
    if (!g.reason && g.marks && g.marks.missing > 0 && g.marks.extra === 0) reason += " 이 오답은 아직 자세한 설명이 없어요. 궁금하면 문장을 검색해 보세요.";
    var mine = g.marks ? '<div class="mine">' + (it.type === "blank" ? "" : "") + g.marks.html + "</div>" : "";
    var title = g.status === "other" ? "맞는 영어예요!" : reveal ? "정답을 확인해 보세요" : "다시 한 번 해 볼까요?";
    $sheet.className = "sheet bad";
    $sheet.innerHTML = '<div class="sh-title">' + ico(g.status === "other" ? "ok" : "bad", 26, "#E0552E") + title + "</div>" + mine +
      '<p class="sh-note">' + esc(reason) + "</p>" +
      (reveal ? '<div class="sh-ans">' + withCore(full, coreOf(it)) + "</div>" + listenBtns() + '<button class="key y" id="badBtn">따라 입력하기</button>'
              : '<button class="key y" id="badBtn">다시 입력</button>');
    openSheet();
    document.getElementById("badBtn").onclick = function () {
      closeSheet();
      if (reveal) { R.copy = true; renderItem(); }
      else { var inp = document.getElementById("ans"); inp.select(); inp.focus(); }
    };
  }

  function next() {
    stopSpeak(); closeSheet();
    R.pos++; R.attempt = 0; R.copy = false; persist();
    setTimeout(render, 180);
  }

  function finishPhase() {
    if (R.phase === "main" && R.retry.length) { R.phase = "retryIntro"; persist(); return render(); }
    if (R.phase === "single") { R = null; tab = "wrong"; return renderTab(); }
    st.progress = null; st.done = true; save();
    renderDone();
  }

  function sessionSentences() {
    var out = S.intro.examples.slice();
    S.items.forEach(function (it) { out.push({ en: fullAnswer(it), ko: it.ko }); });
    return out;
  }

  function renderDone() {
    setPaper(false); drawTabbar(false);
    var made = sessionSentences();
    $screen.className = "screen done";
    $screen.innerHTML =
      '<div class="done-chars"><div style="width:21%">' + charSVG("keycap", "party", "키캡") + '</div><div style="width:20%">' + charSVG("a", "party", "a") +
      '</div><div style="width:27%">' + charSVG("capsule", "party", "캡슐") + '</div><div style="width:19%">' + charSVG("fan", "party", "부채꼴") + "</div></div>" +
      "<h1>세션 1 완료!</h1><p class=\"score\">바로 맞힌 문제 " + R.firstOk + " / " + R.total + "</p>" +
      '<div class="panel"><h2>이렇게도 말해요</h2>' + S.tips.map(function (t, i) {
        return '<div class="tip"><div class="from">' + esc(t.from) + '</div><div class="to"><span>' + esc(t.to) + '</span><button class="spk" data-tip="' + i + '" aria-label="듣기">' + ico("speak", 22) + '</button></div><div class="why">' + esc(t.why) + "</div></div>";
      }).join("") + "</div>" +
      '<div class="panel"><h2>오늘 문장 ' + made.length + "개</h2>" + made.map(function (m, i) {
        return '<div class="sent"><div><div class="en">' + esc(m.en) + '</div><div class="ko">' + esc(m.ko) + '</div></div><button class="spk" data-m="' + i + '" aria-label="듣기">' + ico("speak", 20) + "</button></div>";
      }).join("") + "</div>" +
      '<button class="key c" id="followBtn">오늘 문장 따라 말하기</button>' +
      '<button class="key y" id="moreBtn" style="margin-top:12px">10분 더</button>' +
      '<button class="link" id="homeBtn" style="color:var(--paper)">홈으로</button>';
    $screen.onclick = function (e) {
      var t = e.target.closest("[data-tip]"), m = e.target.closest("[data-m]");
      if (t) speak(S.tips[+t.getAttribute("data-tip")].to);
      if (m) speak(made[+m.getAttribute("data-m")].en);
    };
    document.getElementById("followBtn").onclick = function () { startFollow(made); };
    document.getElementById("moreBtn").onclick = function () { toast("샘플에는 세션 1만 있어요"); };
    document.getElementById("homeBtn").onclick = function () { R = null; tab = "home"; renderTab(); };
  }

  /* ================= 따라 말하기 ================= */
  function startFollow(list) {
    var f = document.createElement("div"); f.className = "follow"; $app.appendChild(f);
    var i = 0, stopped = false, timer = null;
    function draw(phase) {
      f.innerHTML = '<div class="count">' + (i + 1) + " / " + list.length + '</div><div class="mid"><div class="en">' + esc(list[i].en) + '</div><div class="ko">' + esc(list[i].ko) +
        '</div><div class="phase">' + phase + "</div></div>" +
        '<div class="listen" style="margin-bottom:12px"><button data-f="n" style="background:#fff">' + ico("speak", 20) + '다시 듣기</button><button data-f="s" style="background:#fff">' + ico("slow", 20) + "느리게</button></div>" +
        '<button class="key d" id="fStop">그만하기</button>';
      f.querySelector("#fStop").onclick = end;
      f.querySelector('[data-f="n"]').onclick = function () { play(false); };
      f.querySelector('[data-f="s"]').onclick = function () { play(true); };
    }
    function play(slow) {
      clearTimeout(timer); draw("듣기");
      var words = list[i].en.split(" ").length;
      speak(list[i].en, slow, function () {
        if (stopped) return;
        draw("따라 말해 보세요");
        timer = setTimeout(function () { if (stopped) return; i++; if (i >= list.length) end(); else play(false); }, 1200 + words * (slow ? 700 : 450));
      });
    }
    function end() { stopped = true; clearTimeout(timer); stopSpeak(); f.remove(); }
    draw(""); play(false);
  }

  renderTab();
})();
</script>

</body>
</html>
